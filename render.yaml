services:
  - type: web
    name: humana-rag-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_RERANK_MODEL
        value: rerank-v3.5
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: CHROMA_PERSIST_DIRECTORY
        value: /app/data/chroma
      - key: HYBRID_ALPHA
        value: "0.7"
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: CORS_ORIGINS
        sync: false
      - key: DEBUG_RAG
        value: "false"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medical Document Q&amp;A</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="config.js"></script>
<script defer src="app.js"></script>
</head>
<body class="h-screen bg-slate-100 text-slate-900 flex flex-col">

  <header class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between shrink-0">
    <div>
      <h1 class="text-lg font-semibold">Medical Document Q&amp;A</h1>
      <p class="text-xs text-slate-400">Answers are grounded strictly in the uploaded document. Not a substitute for professional medical advice. Not HIPAA-compliant.</p>
    </div>
  </header>

  <div id="error-banner" class="hidden bg-red-600 text-white text-sm px-6 py-2 shrink-0"></div>

  <main class="flex-1 flex overflow-hidden">

    <aside class="w-80 bg-white border-r border-slate-200 flex flex-col shrink-0">
      <div class="p-4 border-b border-slate-200">
        <h2 class="text-sm font-semibold text-slate-700 mb-2">Upload a PDF</h2>
        <input id="file-input" type="file" accept=".pdf,application/pdf"
               class="block w-full text-sm text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-slate-800 file:text-white file:text-sm hover:file:bg-slate-700" />
        <p id="upload-status" class="text-xs text-slate-500 mt-2"></p>
      </div>

      <div class="flex-1 overflow-y-auto p-4">
        <h2 class="text-sm font-semibold text-slate-700 mb-2">Documents</h2>
        <ul id="document-list" class="space-y-2"></ul>
      </div>
    </aside>

    <section class="flex-1 flex flex-col">
      <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

      <form id="chat-form" class="border-t border-slate-200 bg-white p-4 flex gap-2 shrink-0">
        <input id="question-input" type="text" placeholder="Ask a question about the selected document…"
               class="flex-1 border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800" disabled />
        <button type="submit" id="send-button"
                class="bg-slate-800 text-white text-sm px-4 py-2 rounded hover:bg-slate-700 disabled:opacity-40" disabled>
          Send
        </button>
      </form>
    </section>

  </main>

</body>
</html>
